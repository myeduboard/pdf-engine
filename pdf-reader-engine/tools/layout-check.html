<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PDF Reader Engine — HTML notes layout check</title>
<link rel="stylesheet" href="../pdfre.css">
<style>
  body{margin:0;padding:28px 20px 60px;background:#141517;color:#e8eaed;
       font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:1100px;margin:0 auto}
  h1{font-size:19px;margin:0 0 4px}
  p.lede{color:#9aa0a6;font-size:13px;margin:0 0 20px;max-width:70ch}
  table{border-collapse:collapse;width:100%;margin:18px 0 26px;font-size:13px}
  th,td{padding:8px 10px;text-align:left;border-bottom:1px solid rgba(255,255,255,.1)}
  th{color:#9aa0a6;font-weight:600;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase}
  td.n{font-family:ui-monospace,Menlo,monospace}
  .pass{color:#81c995;font-weight:600}
  .fail{color:#f28b82;font-weight:600}
  #stage{width:390px;outline:1px dashed rgba(255,255,255,.2)}
  .note{color:#9aa0a6;font-size:12.5px}
</style>
</head>
<body>
<div class="wrap">
  <h1>HTML notes — layout check</h1>
  <p class="lede">Mounts the sample notes in a 390px-wide frame and measures what the
  engine actually did. Serve this folder over http (<code>python3 -m http.server</code>)
  — opening the file directly will block the fetch.</p>

  <table id="out"><thead><tr><th>Check</th><th>Expected</th><th>Measured</th><th>Result</th></tr></thead>
  <tbody><tr><td colspan="4" class="note">Loading…</td></tr></tbody></table>

  <div id="stage"><div id="viewer"></div></div>
</div>

<script src="../pdfre.js"></script>
<script>
var reader = window.initPdfReader('viewer', {
  src: '../examples/veterinary-microbiology-part-1.html',
  title: 'Layout check',
  height: 520,
  autohide: 'never',
  onReady: function () { setTimeout(run, 400); }
});

function row(name, expected, measured, ok) {
  return '<tr><td>' + name + '</td><td class="n">' + expected +
         '</td><td class="n">' + measured + '</td><td class="' +
         (ok ? 'pass">PASS' : 'fail">FAIL') + '</td></tr>';
}

function run() {
  var frame = document.querySelector('.pdfre-frame');
  var idoc = frame.contentDocument;
  var win = frame.contentWindow;
  var de = idoc.documentElement;
  var doc = idoc.querySelector('.pdfre-doc');
  var sheet = idoc.querySelector('.sheet');
  var rows = [];

  // 1. the author's fixed sheet width survived
  var sheetW = sheet.getBoundingClientRect().width / reader.getState().zoom;
  rows.push(row('Sheet keeps its authored width', '~794px (210mm)',
    Math.round(sheetW) + 'px', Math.abs(sheetW - 794) < 12));

  // 2. the frame can scroll sideways
  var canScrollX = de.scrollWidth - win.innerWidth > 4;
  rows.push(row('Horizontal scroll available at 390px', 'yes',
    canScrollX ? 'yes (' + (de.scrollWidth - win.innerWidth) + 'px)' : 'no', canScrollX));

  // 3. nothing is clipped off the left edge
  var left = sheet.getBoundingClientRect().left + win.scrollX;
  rows.push(row('Left edge reachable (not cut off)', '>= 0',
    Math.round(left) + 'px', left >= -1));

  // 4. the whole sheet is reachable by scrolling
  var reach = de.scrollWidth >= Math.round(sheet.getBoundingClientRect().width) - 2;
  rows.push(row('Full sheet width inside scroll range', 'yes',
    de.scrollWidth + 'px scrollable', reach));

  // 5. zoom actually changes the painted size
  var before = sheet.getBoundingClientRect().width;
  reader.setZoom(reader.getState().zoom * 1.5);
  var after = sheet.getBoundingClientRect().width;
  rows.push(row('Zoom scales the document', '1.5x wider',
    (after / before).toFixed(2) + 'x', Math.abs(after / before - 1.5) < 0.08));

  // 6. zooming in extends the scrollable width
  var grew = de.scrollWidth - win.innerWidth > 4;
  rows.push(row('Zoomed-in overflow is scrollable', 'yes',
    grew ? 'yes (' + (de.scrollWidth - win.innerWidth) + 'px)' : 'no', grew));

  // 7. pan affordance flagged
  rows.push(row('Frame marked pannable', 'pdfre-panx',
    de.className || '(none)', /pdfre-panx/.test(de.className)));

  // 8. no reflow rules applied by default
  rows.push(row('No reflow override on the sheet', 'not applied',
    /pdfre-reflow/.test(de.className) ? 'applied' : 'not applied',
    !/pdfre-reflow/.test(de.className)));

  reader.setZoom('fit-width');
  document.querySelector('#out tbody').innerHTML = rows.join('');
}
</script>
</body>
</html>
